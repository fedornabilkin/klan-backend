name: Production
run-name: Production · ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Проверки
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Project/package-lock.json
      - run: npm ci
        working-directory: Project
      - name: Проверить приложение
        working-directory: Project
        run: |
          npm test
          npm run build
          npm run typecheck:tools
          npm run test:tools
      - name: Подготовить npm-пакеты для сервера
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node Deploy/package-npm-cache.mjs Project/package-lock.json "$HOME/.npm" Project/dist/package-cache.tar.gz
      - name: Сохранить скомпилированный API для VPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: backend-js-${{ github.sha }}
          path: Project/dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  deployment-checks:
    name: Проверки выкладки
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Project/package-lock.json
      - run: npm ci
        working-directory: Project
      - name: Проверить скрипты выкладки
        run: |
          for script in Deploy/*.sh; do bash -n "$script"; done
          shellcheck Deploy/*.sh
          node --test Deploy/*.test.mjs

      - name: Проверить Compose без секретов
        env:
          IMAGE_REF: klan-backend:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose -f Docker/compose.production.yaml config --quiet --no-env-resolution

  deploy:
    name: Продакшен
    needs: [checks, deployment-checks]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Не выкатывать устаревший запуск
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "В main уже есть новый коммит. Запустите Production для актуальной main." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: backend-js-${{ github.sha }}
          path: ${{ runner.temp }}/klan-compiled
      - name: Обновить исходники и запустить проверенную сборку
        env:
          CHECKED_DIST: ${{ runner.temp }}/klan-compiled
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash Deploy/deploy.sh
