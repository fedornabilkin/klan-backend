name: klan-backend
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-klan}
      POSTGRES_USER: ${POSTGRES_USER:-klan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]

  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: klan-backend:${IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DEMO_MODE: "false"
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL with host db}
      TELEGRAM_REQUIRE_GROUP_MEMBERSHIP: ${TELEGRAM_REQUIRE_GROUP_MEMBERSHIP:-true}
      TELEGRAM_GROUP_IDS: ${TELEGRAM_GROUP_IDS:-}
      TELEGRAM_GROUP_LEVELS: ${TELEGRAM_GROUP_LEVELS:-}
      TELEGRAM_MEMBERSHIP_TTL_SECONDS: ${TELEGRAM_MEMBERSHIP_TTL_SECONDS:-60}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:?Set BOT_INTERNAL_SECRET}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-3001}:3001"
    networks:
      database:
      application:
        aliases: [api]

volumes:
  postgres_data:

networks:
  database:
    internal: true
  application:
