name: klan-backend-production
services:
  db:
    image: postgres:16-bookworm
    pull_policy: never
    restart: unless-stopped
    env_file:
      - path: ../database.env
        format: raw
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 24
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    image: ${IMAGE_REF:?Use Deploy/server-release.sh}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: ../runtime.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: '3001'
      DEMO_MODE: 'false'
    ports: ['127.0.0.1:3101:3001']
    depends_on:
      db:
        condition: service_healthy
    networks:
      database:
      application:
        aliases: [api]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  postgres:
    external: true
    name: klan-production-postgres
networks:
  database:
    internal: true
  application:
    external: true
    name: klan-production
